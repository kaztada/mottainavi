<!doctype html>
<!--
  public/ogp.png の元になるページ(1200×630)。
  文言を変えたら、ブラウザで 1200×630 の大きさに表示してスクリーンショットを撮り、public/ogp.png に置き換える。
  例: Chrome を --headless=new --window-size=1200,630 --force-device-scale-factor=1 --screenshot=ogp.png で起動する。
  色は src/app/globals.css の値に合わせている。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #faf9f6;
    color: #3a382f;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  .circle { position: absolute; border-radius: 50%; background: #eef3ea; }
  .c1 { width: 400px; height: 400px; left: 860px; top: -60px; }
  .c2 { width: 320px; height: 320px; left: 820px; top: 470px; }
  .inner { position: absolute; left: 96px; top: 104px; }
  .sprout { font-size: 84px; line-height: 1; }
  h1 { margin-top: 30px; font-size: 112px; font-weight: 700; line-height: 1.15; letter-spacing: 0.02em; }
  .sub { margin-top: 28px; font-size: 38px; line-height: 1.5; color: #6f6b60; font-weight: 400; }
  .chips { margin-top: 30px; display: flex; gap: 16px; }
  .chip {
    padding: 12px 30px;
    border: 2px solid #e9e5da;
    border-radius: 999px;
    background: #ffffff;
    color: #4d7544;
    font-size: 27px;
    font-weight: 500;
    line-height: 1.4;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="inner">
    <div class="sprout">🌱</div>
    <h1>もったいナビ</h1>
    <p class="sub">「これ、どう手放す?」<br>捨て方と、捨てる前の選択肢をまとめて検索</p>
    <div class="chips">
      <span class="chip">ごみ分別検索</span>
      <span class="chip">♻️ 手放し方も</span>
      <span class="chip">日本語 / English</span>
    </div>
  </div>
</body>
</html>
